line-length = 120
indent-width = 4

[lint]
select = [
    "E",
    "W",
    "F"
]
extend-select = [
    "ERA",
    "ANN",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "EM",
    "FIX",
    "FA",
    "ISC",
    "LOG",
    "G",
    "INP",
    "PIE",
    "T20",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "SLOT",
    "TID",
    "TD",
    "TC",
    "ARG",
    "PTH",
    "FLY",
    "I",
    "C90",
    "N",
    "PERF",
    "DOC",
    "D",
    "PGH",
    "PL",
    "UP",
    "FURB",
    "RUF",
    "TRY"
]
ignore = [
    "D203",
    "D213",
    "DOC502"
]

[lint.pylint]
max-branches = 15
max-statements = 75

[lint.mccabe]
max-complexity = 15

[lint.flake8-quotes]
inline-quotes = "double"

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
line-ending = "lf"
