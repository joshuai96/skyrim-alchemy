<div class="min-h-screen bg-base-100">
  <div class="navbar bg-base-200 shadow-sm">
    <div class="navbar-start">
      <h1 class="text-xl font-bold px-4">Skyrim Alchemy</h1>
    </div>
  </div>

  <main class="container mx-auto p-4 max-w-6xl">
    <app-effect-selector
      [(selectedIds)]="selectedEffectIds"
      [availableEffectIds]="reachableEffectIds()"
      [constrainToAvailable]="hasSelectedIngredients()"
    />

    <div class="mt-6">
      <app-ingredient-list
        [selectedEffectIds]="selectedEffectIds()"
        [(selectedIngredientIds)]="selectedIngredientIds"
      />
    </div>
  </main>
</div>
